<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Tool Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <nav>
            <div class="logo">AI FINDER.</div>
            <div class="nav-link">Find the right tool.</div>
        </nav>

        <div class="hero">

            <div class="badge">TOOL DISCOVERY</div>

            <h1>
                What are you
                <span class="highlight">trying</span>
                to do?
            </h1>

            <p class="subtitle">
                Tell us what you need, and we'll help you find
                the AI tool that fits the job.
            </p>

            <div class="search-box">

                <input
                    type="text"
                    placeholder="I want to create a presentation..."
                >

                <button onclick="findTools()">
                    Find Tools →
                </button>

            </div>

            <div id="result"></div>

        </div>

    </div>

    <script src="tools.js"></script>
    <script src="script.js"></script>

</body>

</html>
